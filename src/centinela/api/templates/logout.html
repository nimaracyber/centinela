{% extends "base.html" %}
{% block title %}Cerrar sesión{% endblock %}
{% block content %}
<div class="card narrow">
  <h1 class="card-title">Cerrar sesión</h1>
  <p>¿Querés salir del dashboard de Centinela?</p>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="btn btn-primary" type="submit">Sí, cerrar sesión</button>
    <a class="btn btn-ghost" href="/">Cancelar</a>
  </form>
</div>
{% endblock %}
