[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "centinela"
version = "0.1.0"
description = "Análisis pasivo y en tiempo real del correo de PyMEs: detecta RATs, stealers, loaders y phishing en adjuntos y links sin bloquear el flujo de mails."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Centinela contributors" }]
keywords = ["email", "security", "malware", "yara", "clamav", "pyme", "smb", "phishing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
  "imapclient>=3.0",
  "aiosmtpd>=1.4",
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "msal>=1.28",
  "oletools>=0.60",
  "pefile>=2023.2.7",
  "LnkParse3>=1.3",
  "pypdf>=4.2",
  "puremagic>=1.20",
  "py7zr>=0.21",
  "rarfile>=4.2",
  "pycdlib>=1.14",
  "tldextract>=5.1",
  "dnspython>=2.6",
  "prometheus-client>=0.20",
  "cryptography>=42",
  "typer>=0.12",
  "yara-x>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
yara-legacy = ["yara-python>=4.5"]  # alternativa a yara-x si se necesitan módulos clásicos
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21", "fakeredis>=2.23"]

[project.scripts]
centinela = "centinela.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/centinela"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
